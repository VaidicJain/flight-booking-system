services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:80
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      - db
  db:
    image: postgres:16
    restart: always
    container_name: postgres-db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
volumes:
  db_data:
